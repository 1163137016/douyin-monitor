name: 抖音监控（自动下载 + 微信推送）

on:
  schedule:
    # 每 6 小时跑一次（UTC）。GitHub 定时任务可能延迟几分钟。
    - cron: "0 */6 * * *"
  workflow_dispatch: {}        # 允许在 Actions 页面手动点 "Run workflow" 测试

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 用缓存保存增量基准与已下载文件（社区版 Actions 缓存上限 10GB）
      - name: Restore cache (downloads + state)
        uses: actions/cache@v4
        with:
          path: |
            downloads
            state.json
          key: douyin-monitor-${{ github.run_id }}
          restore-keys: |
            douyin-monitor-

      - name: Run monitor
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          MONITOR_URLS: ${{ secrets.MONITOR_URLS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MAX_PAGES: ${{ secrets.MAX_PAGES }}
        run: python monitor_run.py

      # 即便后续步骤失败也尽量把本次产物保存进缓存
      - name: Save cache (downloads + state)
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            downloads
            state.json
          key: douyin-monitor-${{ github.run_id }}
