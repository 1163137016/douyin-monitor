name: 抖音监控（自动下载 + 云端画廊 + 微信推送）

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write      # 需要写权限: 创建 release 并上传作品附件
  pages: write
  id-token: write

concurrency:
  group: douyin-pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 上传附件需要更多时间
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache (downloads + state)
        uses: actions/cache@v4
        with:
          path: |
            downloads
            state
          key: douyin-monitor-${{ github.run_id }}
          restore-keys: |
            douyin-monitor-

      - name: Run monitor
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          MONITOR_URLS: ${{ secrets.MONITOR_URLS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MAX_PAGES: ${{ secrets.MAX_PAGES }}
          ACCOUNTS_URL: ${{ secrets.ACCOUNTS_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor_run.py

      - name: Build gallery
        run: python build_gallery.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push gallery link (手动必推 / 有新作品才推)
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          N=0
          [ -f run_new_count.txt ] && N=$(tr -dc '0-9' < run_new_count.txt)
          [ -z "$N" ] && N=0
          echo "本次新作品数: $N  触发方式: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$N" -gt 0 ]; then
            URL="${{ steps.deployment.outputs.page_url }}"
            if [ "$N" -gt 0 ]; then
              TITLE="抖音作品库已更新(云端可播放)"
              DESC="本次新增 $N 条新作品，点此在浏览器在线观看(无需进抖音): $URL"
            else
              TITLE="抖音作品库(手动查看)"
              DESC="本次无新作品。作品库链接（可随时在线观看）: $URL"
            fi
            curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
              --data-urlencode "title=$TITLE" \
              --data-urlencode "desp=$DESC"
          else
            echo "定时运行且无新作品 -> 不推送"
          fi
