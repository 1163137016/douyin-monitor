name: 抖音监控（自动下载 + 云端画廊 + 微信推送）

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: douyin-pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache (downloads + state)
        uses: actions/cache@v4
        with:
          path: |
            downloads
            state.json
          key: douyin-monitor-${{ github.run_id }}
          restore-keys: |
            douyin-monitor-

      - name: Run monitor
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          MONITOR_URLS: ${{ secrets.MONITOR_URLS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MAX_PAGES: ${{ secrets.MAX_PAGES }}
        run: python monitor_run.py

      - name: Build gallery
        run: python build_gallery.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push gallery link (仅当有新作品)
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          N=$(cat run_new_count.txt 2>/dev/null || echo 0)
          if [ "$N" -gt 0 ]; then
            URL="${{ steps.deployment.outputs.page_url }}"
            curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
              --data-urlencode "title=抖音作品库已更新(云端可播放)" \
              --data-urlencode "desp=本次新增作品，点此在浏览器在线观看(无需进抖音): $URL"
          fi
